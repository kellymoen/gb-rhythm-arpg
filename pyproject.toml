[project]
name = "beatarpg-tools"
version = "0.1.0"
description = "Asset and data converters for the Beat ARPG Game Boy build"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyboy>=2.8.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests/tools"]
