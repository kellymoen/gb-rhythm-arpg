# Placeholder sound effect (docs/sfx.md). Save your own as assets/sfx/dodge.toml to replace it.
# Dodge: a short rising "fwip". The P1 hardware sweep raises the pitch until it overflows and cuts.
channel = "P1"
priority = 6

[[step]]
frames = 8
volume = 10
env_pace = 1
duty = 1
pitch = "G3"
sweep_pace = 2
sweep_dir = "up"
sweep_step = 4
